services:
    app:
        build:
            context: .
            args:
                VITE_STUN_URLS: ${VITE_STUN_URLS-stun:stun.l.google.com:19302}
        ports:
            - "127.0.0.1:${APP_PORT:-8080}:3001"
        environment:
            TURN_URLS: ${TURN_URLS:-}
            TURN_SECRET: ${TURN_SECRET:-}
            TURN_TTL_SECONDS: ${TURN_TTL_SECONDS:-86400}
        restart: unless-stopped
